
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex Basis Example</title>

  <style>
    .container {
      display: flex;
      width: 900px;
      max-width: 100%;
      background-color: #e2e8f0;
      padding: 10px;
      box-sizing: border-box;
    }

    .box {
      height: 120px;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      box-sizing: border-box;
      flex-grow: 0;
      flex-shrink: 1;
    }

    .box1 {
      flex-basis: 150px;
      background-color: #2563eb;
    }

    .box2 {
      flex-basis: 250px;
      background-color: #16a34a;
    }

    .box3 {
      flex-basis: 350px;
      background-color: #9333ea;
    }
  </style>
</head>
<body>

  <h2>CSS Flex Basis</h2>

  <div class="container">
    <div class="box box1">150px</div>
    <div class="box box2">250px</div>
    <div class="box box3">350px</div>
  </div>

</body>
</html>
