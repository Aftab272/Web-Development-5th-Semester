
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex Order</title>

  <style>
    .container {
      display: flex;
      gap: 10px;
      padding: 15px;
      background-color: #e2e8f0;
    }

    .box {
      width: 100px;
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 20px;
      border-radius: 8px;
    }

    .box1 {
      background-color: #2563eb;
      order: 3;
    }

    .box2 {
      background-color: #16a34a;
      order: 1;
    }

    .box3 {
      background-color: #9333ea;
      order: 2;
    }
  </style>
</head>
<body>

  <h2>CSS Flex Order</h2>

  <div class="container">
    <div class="box box1">Box 1</div>
    <div class="box box2">Box 2</div>
    <div class="box box3">Box 3</div>
  </div>

</body>
</html>
