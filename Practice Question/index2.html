
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Items Cards</title>
    <link rel="stylesheet" href="style.css">
    <style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    display: flex;
    gap: 15px;
    padding: 20px;
}

.card {
    flex: 1;
    padding: 40px 10px;
    color: white;
    border-radius: 10px;
    font-size: 18px;
}

.card1 {
    background-color: #2563eb;
}

.card2 {
    background-color: #16a34a;
}

.card3 {
    background-color: #9333ea;
}

.card4 {
    background-color: #ea580c;
}
</style>
</head>
<body>

    <h1>Our Services</h1>

    <div class="container">
        <div class="card card1">Web Development</div>
        <div class="card card2">Graphic Design</div>
        <div class="card card3">UI/UX Design</div>
        <div class="card card4">Digital Marketing</div>
    </div>

</body>
</html>
