
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main and Cross Axis</title>
    <link rel="stylesheet" href="style.css">
    <style>
.container {
    display: flex;
    flex-direction: row;
    gap: 15px;
    background-color: #eeeeee;
    padding: 20px;
}

.box {
    background-color: #2563eb;
    color: white;
    padding: 30px;
    text-align: center;
    border-radius: 8px;
}

/* Try changing row to column */
</style>
</head>
<body>

    <h2>Flexbox Axes</h2>

    <div class="container">
        <div class="box box1">Box 1</div>
        <div class="box box2">Box 2</div>
        <div class="box box3">Box 3</div>
    </div>

</body>
</html>
