
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
body {
    font-family: Arial, sans-serif;
    background-color: #f1f5f9;
    padding: 20px;
}

h1 {
    color: #0f172a;
}

.dashboard {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 250px;
}

.item {
    background-color: #2563eb;
    color: white;
    padding: 20px;
    border-radius: 8px;
    text-align: center;
}
</style>
</head>
<body>

    <h1>Student Dashboard</h1>

    <div class="dashboard">
        <div class="item">My Courses</div>
        <div class="item">Assignments</div>
        <div class="item">Results</div>
    </div>

</body>
</html>
