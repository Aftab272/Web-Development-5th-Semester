
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justify Content</title>
    <link rel="stylesheet" href="style.css">
    <style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
}

.container {
    display: flex;
    flex-direction: row;
    justify-content: flex-start;
    gap: 10px;
    background-color: #e2e8f0;
    padding: 20px;
    min-height: 60px;
}

button {
    background-color: #2563eb;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 5px;
    cursor: pointer;
}
</style>
</head>
<body>

    <h2>Justify Content Demo</h2>

    <div class="container">
        <button>Home</button>
        <button>About</button>
        <button>Courses</button>
        <button>Contact</button>
        <button>Login</button>
    </div>

</body>
</html>
