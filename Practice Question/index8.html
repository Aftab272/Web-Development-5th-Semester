
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Grow</title>
    <link rel="stylesheet" href="style.css">
    <style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
}

.container {
    display: flex;
    width: 800px;
    max-width: 100%;
    background-color: #e2e8f0;
    min-height: 120px;
}

.box {
    flex-basis: 100px;
    color: white;
    text-align: center;
    padding: 20px 5px;
}

.box1 {
    flex-grow: 1;
    background-color: #2563eb;
}

.box2 {
    flex-grow: 2;
    background-color: #16a34a;
}

.box3 {
    flex-grow: 1;
    background-color: #9333ea;
}
</style>
</head>
<body>

    <h2>Flex Grow Example</h2>

    <div class="container">
        <div class="box box1">Grow: 1</div>
        <div class="box box2">Grow: 2</div>
        <div class="box box3">Grow: 1</div>
    </div>

</body>
</html>
