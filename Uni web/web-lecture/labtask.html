<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up</title>
    <style>
        *{
            box-sizing:border-box;
        }
        input[ type="email"]{
            width: 100%;
            padding: 15px;
            margin: 5px 0 22px 0;
            display: inline-block;
            border: none;
            background: #f1f1f165;
            }
        input[ text=email] :focus{
            background-color: #ddd;
            outline: none;
        }
         input[ text=password] :focus{
            background-color: #ddd;
            outline: none;
        }
         input[ text=repeat-password] :focus{
            background-color: #ddd;
            outline: none;
        }
       
        .cancel{
            background-color: red;
        }
        button {
            background-color: #04aa57;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            cursor: pointer;
            width: 100%;
            opacity: 0.9;
        }
        button:hover{
            opacity:1;
        }

        
        input[ type="password"]{
            width: 100%;
            padding: 15px;
            margin: 5px 0 22px 0;
            display: inline-block;
            border: none;
            background: #f1f1f165;


        }
        input[ type="Repeat Password"]{
            width: 100%;
            padding: 15px;
            margin: 5px 0 22px 0;
            display: inline-block;
            border: none;
            background: #f1f1f136;
        }
        .cancelbtn, .signupbtn {
            float: left;
            width: 50%;
        }
        .container{
            width: 100%;
            padding: 16px;
        }
        @media screen and (max-width: 300px){
            .cancelbtn, .signupbtn{
                width: 100%;
            }
        }
    </style>

   
</head>

<body style="border:1px solid #ccc">

    <div class="container">
        <div class="clearfix"></div>

        <h1>Sign Up</h1>

        <p class="description">
            Please fill in this form to create an account.
        </p>
            <hr>
        <form>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email</label>
                   <br>
                <input 
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter Email"
                    required
                >
            </div>


            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                 <br>
                <input 
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter Password"
                    required
                >
            </div>


            <!-- Repeat Password -->
            <div class="form-group">
                <label for="repeatPassword">Repeat Password</label>
                 <br>
                <input 
                    type="password"
                    id="repeatPassword"
                    name="repeatPassword"
                    placeholder="Repeat Password"
                    required
                >
            </div>


            <!-- Remember Me -->
            <div class="remember">

                <label style="font-weight: normal; display: inline;">

                    <input 
                        type="checkbox"
                        name="remember"
                        checked
                    >

                    Remember me

                </label>

            </div>


            <!-- Terms -->
            <div class="terms">

                By creating an account you agree to our

                <a href="#">Terms & Privacy</a>.

            </div>


            <!-- Buttons -->
            <div class="buttons">
                  <hr>
                <button type="button" class="cancel">
                    Cancel
                </button>
                <button type="submit" class="signup">
                    Sign Up
                </button>

            </div>

        </form>

    </div>

</body>
</html>
